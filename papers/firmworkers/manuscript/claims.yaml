meta:
  title: 'Inequality and Social Contests: manuscript skeleton'
  manuscript: 'firmworkers_model.pdf, 15 March 2026 (Appendix: The closed N-player economy; Linear Approximation for Risk-Premium)'
  pass: 2

model_status:
  LEAN_PROVED: 'Lean theorem compiles against Mathlib without sorry'
  LEAN_WRITTEN: 'Lean theorem written, not yet compiled'
  OPEN: 'stated in the manuscript, no formal object yet'
  UNDERSPECIFIED: 'the manuscript leaves a primitive undefined'
  ILL_POSED: 'not well-defined as printed'
  REFUTED: 'contradicted by a proved or checked claim'
  DECIDED: 'a primitive the manuscript leaves open, fixed by the author and recorded in Appendix D with its date and reason'

literature_status:
  VERBATIM: 'quote extracted from the primary text supplied, page given, checked against local text'
  PRIMARY_WEB: 'primary full text read through the web tool, quote not verbatim-checked'
  ABSTRACT: 'only the abstract or publisher summary was read'
  SECONDARY: 'supported only by a secondary source'

headline: []

summary:
  - para: 1
    text: 'The economy is a ladder of a fixed number of jobs, one worker in each, with income rising in rank.'
    rests_on: ['M2', 'anchor: Every worker holds exactly one job and the number of jobs does not change over time in the economy']
  - para: 1
    text: 'Incomes follow the Pareto pattern, and a lower tail index means a steeper ladder and more inequality.'
    rests_on: ['M3', 'M4']
  - para: 1
    text: 'Each worker belongs to one of two status groups throughout a working life.'
    rests_on: ['M28', 'M29']
  - para: 2
    text: 'Each period creative destruction displaces every job holder with the same chance, whatever the rank, and each displaced worker takes one of three routes before holding a job again.'
    rests_on: ['M39', 'M32', 'anchor: triggered by uniform displacements']
  - para: 2
    text: 'The downgrade pays the bottom income.'
    rests_on: ['M32']
  - para: 2
    text: 'The return buys the former job back at an upskilling cost that rises with the income climbed.'
    rests_on: ['M38', 'M7', 'Isc.loss_and_cost_rise_with_rank']
  - para: 2
    text: 'Displaced workers who choose the lottery are its entrants, and each pays the lottery cost and receives the former job of a partner, another entrant drawn at random.'
    rests_on: ['M11', 'M14', 'M32', 'M36']
  - para: 2
    text: 'Closure lowers the chance that the partner comes from the other status group.'
    rests_on: ['M29']
  - para: 3
    text: 'The lottery moves income between entrants without creating any, so the pool loses the lottery costs.'
    rests_on: ['M10', 'M12']
  - para: 3
    text: 'When no partner''s former income less the lottery cost falls below the bottom income, every entrant does at least as well in the lottery as in the downgrade, whatever the shape of utility.'
    rests_on: ['M33']
  - para: 3
    text: 'A richer entrant values the lottery no more than a poorer one, and the gap shrinks as the pool grows.'
    rests_on: ['M34']
  - para: 4
    text: 'When displaced workers value income at its average, those who choose the return form one band of ranks.'
    rests_on: ['Isc.return_set_interval']
  - para: 4
    text: 'Routes are compared by lifetime value, so the return beats the downgrade exactly when its one-time upskilling cost is at most the income climbed times the lifetime multiplier.'
    rests_on: ['M39', 'M40']
  - para: 4
    text: 'More inequality keeps in the lottery the entrants above the rank where the return starts to lose value, and can draw lower entrants back to the return when the upskilling cost is nearly proportional.'
    rests_on: ['Isc.inequality_pushes_top_to_lottery', 'Isc.pool_prizes_rise_with_inequality', 'Isc.lottery_play_can_fall_with_inequality']
  - para: 5
    text: 'The scale of the upskilling cost and the shape of utility are not yet fixed.'
    rests_on: ['M35', 'M19']

# Base case: two displaced workers, rendered at the head of the model section. The rows are
# shown here instead of the model table; the summary follows the rules of the summaries and the
# payoff table the rules of the players table; both are stamped.
base_case:
  title: 'Base case, two displaced workers'
  rows: [M42, M43, M44, M45, M46]
  words: [150, 240]
  summary:
    - para: 1
      text: 'With two entrants the lottery is the exchange of their former jobs, so neither faces any risk.'
      rests_on: ['M42']
    - para: 2
      text: 'The richer entrant gives up income in the exchange, while the poorer gains whenever the lottery cost is below the gap between their former incomes.'
      rests_on: ['M46']
    - para: 2
      text: 'The poorer entrant''s lottery cost goes to the job holders above its former rank, the people whose favour the lottery stands for, and the exchange lifts it into the richer entrant''s former job.'
      rests_on: ['M58', 'M42']
    - para: 2
      text: 'The richer entrant still prefers the exchange to its other routes when its upskilling cost is at least the income it climbs and the poorer entrant''s former income less the lottery cost is at least the bottom income, because the downgrade pays only the bottom income.'
      rests_on: ['M43', 'M32']
    - para: 2
      text: 'The poorer entrant prefers the exchange when its former income is at least the lottery cost below the richer entrant''s, whatever its upskilling cost.'
      rests_on: ['M43']
    - para: 2
      text: 'Both conditions hold for every nondecreasing utility, so the transfer from the richer entrant to the poorer rests on the bottom income rather than on a taste for risk.'
      rests_on: ['M43']
    - para: 3
      text: 'Had the downgrade kept a share of former income, the richer entrant would refuse every partner paying less than that share plus the lottery cost, closing the path from the bottom to the top.'
      rests_on: ['M44']
    - para: 3
      text: 'Closure cannot act with two entrants, nor with two from one status group and one from the other, so it first acts with two in each.'
      rests_on: ['M45']
  payoffs:
    - route: 'downgrade'
      richer: '$x_0$'
      poorer: '$x_0$'
      rests_on: ['M32']
    - route: 'return'
      richer: '$x_j-\kappa(x_j-x_0)^b$'
      poorer: '$x_i-\kappa(x_i-x_0)^b$'
      rests_on: ['M38', 'M7', 'M43']
    - route: 'lottery, which is the exchange'
      richer: '$x_i-L$'
      poorer: '$x_j-L$'
      rests_on: ['M42', 'M11']

# Players of the model and the choices they make, rendered as the sub-section Players of the
# model section. Every cell rests on rows or verbatim source premises; stamped like the summaries.
choice_status:
  DECIDED: 'rests on decided or proved rows; holds in the model as it stands'
  PROPOSED: 'under discussion; the open item names the issue that decides it'
  DEFERRED: 'belongs to the macro model, postponed'
players:
  - name: 'worker'
    definition: 'A worker lives forever on the ladder and is in one of two states, holding a job or displaced. Every worker holds exactly one job and the number of jobs is fixed. Each period a job holder is displaced with the same chance, whatever the rank, and a displaced worker holds a job again next period'
    rests_on: ['M39', 'anchor: Every worker holds exactly one job and the number of jobs does not change over time in the economy', 'anchor: triggered by uniform displacements']
  - name: 'firm'
    definition: 'The one firm of the closed economy, where all income passes between workers and the firm. It sets the income of each job on the ladder and receives the upskilling cost paid on the return. In the source it also ranks workers by perceived earning potential, a rule the micro model does not use'
    rests_on: ['anchor: all income circulates between workers and firm', 'anchor: income level that is eventually set by the firm', 'anchor: rank workers based on the perceived earning potentials of workers', 'M38']
choices:
  - player: 'worker'
    chooses: 'when displaced, one route among the downgrade, the return and the lottery'
    objective: 'lifetime value, the discounted expected income over the rest of a working life with displacement at the displacement rate. Comparisons that hold for any nondecreasing utility of income carry over, because the lifetime value rises with the job''s income'
    status: DECIDED
    rests_on: ['M39', 'M40', 'M41', 'M32', 'M38', 'M36']
    open: 'what the downgrade pays (issue 11a), the unit of the upskilling cost (issue 1), the form of the lottery cost (issue 11d), partner chances under closure (M37), the rule that fills jobs vacated by downgraders (issue 12), whether route costs are paid once (issue 13)'
  - player: 'worker'
    chooses: 'while holding a job, nothing. Displacement strikes every rank with the same chance and cannot be prevented'
    objective: 'none while holding a job. A pool of job holders would not hold together, because its richest entrant does better outside'
    status: DECIDED
    rests_on: ['M39', 'M30']
  - player: 'firm'
    chooses: 'the retraining price, the scale of the upskilling cost'
    objective: 'profit per displaced cohort, receipts from returners less the specific-skill share of the income of every job filled through the lottery. A higher price shrinks the band of returners, so the optimum is interior, and the firm subsidises the retraining of ranks just below the lottery''s worth'
    status: DECIDED
    rests_on: ['M61', 'M62', 'M63', 'M69', 'anchor: flows back to the firm as upskilling investments']
    open: 'the optimal price can fall as the lottery cost rises (M69), so how it moves depends on the ladder; the ladder''s shape as a second instrument (issue 11c, next)'
  - player: 'firm'
    chooses: 'the tail index of the ladder, with the wage bill fixed'
    objective: 'profit as in M61, with the ladder''s shape as a second instrument'
    status: PROPOSED
    rests_on: ['M3', 'M61', 'anchor: The firm thus chooses']
    open: 'the next step after the retraining price (issue 11c)'
  - player: 'firm'
    chooses: 'the split of the wage bill between higher-ranked and lower-ranked workers ($\mu$)'
    objective: 'next period''s assets, through the share of wages spent on upskilling'
    status: DEFERRED
    rests_on: ['anchor: The firm thus chooses', 'anchor: effective upskilling fraction']
  - player: 'worker'
    chooses: 'in the macro model, the share of current income spent on upskilling, the rest going to the lottery ($\lambda$)'
    objective: 'net income with a quadratic risk term'
    status: DEFERRED
    rests_on: ['anchor: as their share of current income allocated to upskilling', 'anchor: The rest of their income is allocated to a shared lottery pool', 'anchor: quadratic risk-premium approximation']

# Idea summaries: one idea of the model each, in plain words, every sentence resting on
# model rows, Lean theorems or a verbatim source premise. Kept in step with the claims by
# summary_stamps.yaml (check.py fails when a cited row or theorem statement changes).
idea_summaries:
  - id: lottery_cause
    title: 'Why displaced workers choose the lottery'
    words: [180, 220]
    sentences:
      - para: 1
        text: 'A worker chooses the lottery only after losing a job to creative destruction.'
        rests_on: ['M32', 'anchor: creative destruction in endogenous growth economy']
      - para: 1
        text: 'Job holders never sustain a pool, because the lottery creates no income and the richest entrant does better outside the pool.'
        rests_on: ['M10', 'M12', 'M24', 'M30', 'M39']
      - para: 2
        text: 'For a displaced worker, the downgrade pays the bottom income, the lowest on the ladder.'
        rests_on: ['M32', 'M3']
      - para: 2
        text: 'When no partner''s former income less the lottery cost falls below the bottom income, the lottery does at least as well as the downgrade, whatever the shape of utility.'
        rests_on: ['M33']
      - para: 2
        text: 'Under that condition even a displaced worker who dislikes risk has no reason to take the downgrade, so the bottom income, not the source''s S-shaped utility, drives the choice between the lottery and the downgrade.'
        rests_on: ['M33', 'M41', 'anchor: higher risk-taking for higher losses', 'anchor: S-shaped Friedman-Savage utility']
      - para: 3
        text: 'Valuing income at its average, a displaced worker whose upskilling cost is at least the income climbed times the lifetime multiplier does no better on the return than on the downgrade, nor, under the condition on partners'' former incomes, than in the lottery.'
        rests_on: ['M38', 'M40', 'M41', 'Isc.top_displaced_prefer_lottery_lifetime']
      - para: 3
        text: 'With a cost exponent of at least one, the cost per unit of income climbed rises with rank, so this case, once it holds at a rank, holds at every higher rank.'
        rests_on: ['Isc.cost_ratio_rises_with_loss', 'Isc.loss_and_cost_rise_with_rank']
      - para: 4
        text: 'The firm prefers upskilling to the lottery, because upskilling spending flows back to the firm whereas lottery spending is lost to the firm.'
        rests_on: ['anchor: flows back to the firm as upskilling investments', 'anchor: rather than being diverted into the social lottery channel']

  - id: lottery_cost
    title: 'What the lottery cost does to each player'
    words: [170, 240]
    sentences:
      - para: 1
        text: 'The lottery cost is the price of competing through connections, the one channel of mobility the firm does not control, and nobody in the model sets it.'
        rests_on: ['anchor: The lottery benefit is an exogenous benefit from social connections that is not managed by the firm', 'M47']
      - para: 1
        text: 'It is paid once by every entrant, to the job holders above the entrant''s former rank whom the entrant''s connections reach, so it stays among workers and flows up the ladder.'
        rests_on: ['M46', 'M58', 'M66']
      - para: 2
        text: 'For a displaced worker, a higher lottery cost lowers the worth of the lottery for every shape of utility, so some who would have entered return instead, and the firm receives their upskilling cost.'
        rests_on: ['M53']
      - para: 2
        text: 'The lottery cost sets the smallest gap in former income that an exchange can bridge with a gain to the poorer entrant.'
        rests_on: ['M46']
      - para: 2
        text: 'It also excludes the poorest, whose former income less the lottery cost falls below the bottom income, because the top prefers the downgrade to their job, and it excludes the top as a prize for anyone within the lottery cost of it, so the window of ranks that can exchange with the top narrows from both ends.'
        rests_on: ['M54']
      - para: 3
        text: 'A job holder receives a share of the lottery cost of every entrant below who reaches the job holder, rising with rank.'
        rests_on: ['M58', 'M66']
      - para: 3
        text: 'The two status groups face the same lottery cost, since closure acts on who can be a partner, not on the price.'
        rests_on: ['M29', 'M47']
      - para: 3
        text: 'The firm never receives the lottery cost, but gains from a higher one, because more displaced workers upskill.'
        rests_on: ['M53', 'anchor: flows back to the firm as upskilling investments']

  - id: closure_meaning
    title: 'What closure is, and what it is not'
    words: [170, 230]
    sentences:
      - para: 1
        text: 'Closure is the one number through which the status group enters the lottery, and it has a counterpart in the world.'
        rests_on: ['M29', 'M47']
      - para: 1
        text: 'In a large pool, the chance that an entrant''s next job comes from the own status group, set against the group''s share among entrants, gives Coleman''s index of inbreeding homophily, and that index equals closure exactly, whatever the group''s size.'
        rests_on: ['L24', 'M68']
      - para: 1
        text: 'So closure is the inbreeding homophily of job-finding connections by status group, how far the connections through which displaced workers find their next job stay within the group, beyond what the group''s size alone would give.'
        rests_on: ['L24', 'M68']
      - para: 2
        text: 'It is not the segregation of jobs by status group, which is the outcome the lottery produces over time, while closure is the mechanism that produces it.'
        rests_on: ['M50', 'M51']
      - para: 2
        text: 'Closure sets how long a gap between the groups'' incomes lasts.'
        rests_on: ['M67']
      - para: 2
        text: 'It is not a preference for the own group, because Currarini, Jackson and Pin separate a bias in whom one meets from a bias in whom one prefers, and closure is the meeting side.'
        rests_on: ['L24', 'M29']
      - para: 2
        text: 'It is not discrimination by the firm, which does not price the status group, since closure lives in the connections among workers.'
        rests_on: ['M47']
      - para: 2
        text: 'Complete closure, in which nobody outside the group is ever reached, is the hard case, whereas below it partners from the other group are only rarer and nobody is refused.'
        rests_on: ['M29', 'L24']
# Questions and answers, rendered as a section after the concluding remarks. Each answer follows
# the rules of the summaries and is stamped, so the answers move with the claims.
faq:
  - question: 'What does it mean that every entrant receives exactly one former job?'
    words: [20, 200]
    answer:
      - text: 'The lottery hands out exactly the former jobs of its entrants, one to each entrant, and no entrant receives their own former job back.'
        rests_on: ['M36']
      - text: 'So every job keeps exactly one worker, and each status group holds as many jobs after the lottery as before, though not the same ranks.'
        rests_on: ['M36', 'M50', 'anchor: Every worker holds exactly one job and the number of jobs does not change over time in the economy']
  - question: 'Can a pool have only one entrant, and what happens then?'
    words: [20, 200]
    answer:
      - text: 'Displacement strikes each job holder with the same chance, so a period can leave exactly one displaced worker in the lottery.'
        rests_on: ['M39']
      - text: 'The lottery is then unavailable, because the only former job in the pool is the entrant''s own, and the entrant chooses between the return and the downgrade.'
        rests_on: ['M55']
      - text: 'Handing the lone entrant their own former job back at the lottery cost would let the lottery undercut the return whenever the lottery cost is below the upskilling cost, and the firm would then receive nothing.'
        rests_on: ['M52']
  - question: 'What does the handling of a pool of one imply for larger pools?'
    words: [20, 220]
    answer:
      - text: 'The chance that fewer than two workers enter the lottery falls to zero as the number of workers grows, for any chance of entry strictly between zero and one.'
        rests_on: ['M56']
      - text: 'A displaced worker who enters and finds no partner takes the route it would otherwise have chosen, so the chance of an empty pool does not change who enters, and choices in pools of every size are as if every pool had two entrants or more.'
        rests_on: ['M57']
      - text: 'Handing back the lone entrant''s own former job would instead give the lottery a guaranteed minimum that the return lacks, and draw more workers into the lottery in pools of every size.'
        rests_on: ['M57', 'M52']
  - question: 'Does a job holder expect to lose the job, and can the job holder protect it?'
    words: [20, 200]
    answer:
      - text: 'A job holder is displaced with the same chance in every period, whatever the rank, and nothing the job holder does changes that chance.'
        rests_on: ['M39']
      - text: 'The lottery never takes a job from a job holder, because only the former jobs of entrants are handed out.'
        rests_on: ['M36', 'M32']
  - question: 'Who sets the lottery cost, and does the firm''s preference for upskilling survive it?'
    words: [20, 200]
    answer:
      - text: 'Nobody in the model sets the lottery cost, which is the price of competing through connections, the one channel of mobility the firm does not manage.'
        rests_on: ['anchor: The lottery benefit is an exogenous benefit from social connections that is not managed by the firm', 'M47']
      - text: 'The firm never receives the lottery cost, which goes to the job holders above the entrant, and a higher lottery cost leads more displaced workers to return and pay the firm the upskilling cost, so the firm''s preference for upskilling over the lottery holds.'
        rests_on: ['M53', 'M58', 'anchor: flows back to the firm as upskilling investments']
  - question: 'How does the choice between the lottery and upskilling look to the firm, to the displaced worker and to workers taken together?'
    words: [30, 230]
    answer:
      - text: 'The displaced worker compares the former income less the upskilling cost with the expected prize less the lottery cost, and so weighs the difference between the two costs against the difference between the prize and the former income.'
        rests_on: ['M60']
      - text: 'The firm receives the upskilling cost from a returner and loses the specific-skill share of a job filled through the lottery, so it prefers the return whatever the two costs are, and it sets the retraining price to keep as many ranks returning as pays.'
        rests_on: ['M60', 'M61']
      - text: 'The job holders above the entrant receive the lottery cost, so they gain when the displaced worker enters, and workers taken together recover it and prefer the lottery whenever the displaced worker does.'
        rests_on: ['M60', 'M58']
  - question: 'How does a status group benefit from the lottery?'
    words: [30, 230]
    answer:
      - text: 'Through the lottery cost a status group gains as far as its members hold the ranks above the entrants who reach them, because an entrant whose connections reach only the own group pays only that group''s job holders, while any other entrant pays the job holders above whatever their group.'
        rests_on: ['M58', 'M66']
      - text: 'Under complete closure each group''s job holders receive exactly what the group''s entrants pay.'
        rests_on: ['M66']
      - text: 'The group benefits through ranks instead, because the lottery can move higher ranks from one group to the other, and with two entrants from each group the expected gap between a group''s share of their former income and half the total shrinks with every lottery unless closure is complete.'
        rests_on: ['M50', 'M51']
      - text: 'In a large pool the gap between the groups'' mean incomes shrinks every period by the same factor whatever the groups'' sizes, and that factor depends only on closure and on how many displaced workers enter the lottery.'
        rests_on: ['M67']
      - text: 'So a group holding the lower ranks gains ranks from an open lottery, and a group holding the higher ranks keeps them longer the stronger closure is.'
        rests_on: ['M51']
  - question: 'Where does the lottery cost go?'
    words: [20, 200]
    answer:
      - text: 'The lottery cost stays among workers, in a closed economy in which all income passes between workers and the firm.'
        rests_on: ['M58', 'anchor: all income circulates between workers and firm']
      - text: 'Each entrant pays it to the job holders strictly above the entrant''s former rank, in equal shares, and an entrant with nobody above pays all job holders equally.'
        rests_on: ['M58']
      - text: 'An entrant whose connections reach only the own status group pays only that group''s job holders in this way.'
        rests_on: ['M66']
      - text: 'Such receipts do not depend on one''s own route, so they change no result that rests on first-order dominance or on valuing income at its average.'
        rests_on: ['M59']
  - question: 'Why does the model have only one social attribute?'
    words: [20, 200]
    answer:
      - text: 'The status group is the only order outside the market, and a separate set of brokers would have added a second one with its own rules and its own measurement.'
        rests_on: ['M47']
      - text: 'Paying the lottery cost to the job holders above the entrant uses rank, which the model already has, so the people whose favour the lottery stands for need no attribute of their own.'
        rests_on: ['M58', 'M47']
  - question: 'What is a status group, and how does it differ from rank?'
    words: [20, 200]
    answer:
      - text: 'Rank is the order of jobs on the ladder, set by the firm, whereas the status group is the order outside the market, inherited and not priced.'
        rests_on: ['M47', 'M2']
      - text: 'Neither is a function of the other, and the status group acts only on access to partners in the lottery, the one allocation of jobs the firm does not make.'
        rests_on: ['M47']
  - question: 'Why can closure not act with fewer than two entrants in each status group?'
    words: [20, 200]
    answer:
      - text: 'With two entrants the lottery is a sure exchange, and with two from one group and one from the other every reassignment moves two of the three jobs across the groups.'
        rests_on: ['M42', 'M45']
      - text: 'Closure first acts with two entrants in each group, where one reassignment keeps every job within its group.'
        rests_on: ['M45', 'M49']

# Decisions without a model row, with their reasons. Decisions with a row carry theirs in the
# row's decision field; the manuscript renders both in the section Decisions and their reasons.
decisions:
  - date: '10 Oct 2026'
    decision: 'Primary sources, with a record and Lean, are required for every paper a claim rests on or a novelty check needs; exploration does not need them.'
    reason: 'A claim about a source is written only after the source is read, so nothing in the manuscript rests on a paraphrase or an abstract.'
    bears_on: ['L1']
  - date: '10 Oct 2026'
    decision: 'Proofs stay in Lean only; informal proofs are deferred, not dropped.'
    reason: 'Every mathematical claim is machine checked before it is stated, and the axiom audit shows what each proof rests on.'
    bears_on: ['M2']
  - date: '10 Oct 2026'
    decision: 'No paper prose for now; the work is on claims, and prose will be written from the claims later.'
    reason: 'A sentence is written from a verified row and never ahead of it.'
    bears_on: ['M2']
  - date: '10 Oct 2026'
    decision: 'Headline claims rest on the measurement map as their empirical key, not on model rows alone.'
    reason: 'A headline must say what would be observed; a model row alone does not. This departs from the skeleton''s rule MS-2 deliberately.'
    bears_on: ['X1']
  - date: '10 Oct 2026'
    decision: 'The micro state is rank plus the status group.'
    reason: 'Not recorded at the time. The manuscript''s two dimensions of social capital, adaptability and categorisation, are the evident ground, and the second became the status group in M47.'
    bears_on: ['M47', 'X2', 'X24']
  - date: '10 Oct 2026'
    decision: 'Closure enters the movement between ranks, not the accumulation of the status group.'
    reason: 'The friction of interest arises from non-contractual relationships in Weber''s framework, so it belongs where jobs change hands outside the market.'
    bears_on: ['M29']
  - date: '10 Oct 2026'
    decision: 'Utility is not observed; preferences over income lotteries take the expected-utility form, so utility is a representation unique up to a positive affine transformation.'
    reason: 'Only the curvature of utility is then meaningful, and the sign of the risk term is invariant to the representation (M16).'
    bears_on: ['M16', 'X9']
  - date: '10 Oct 2026'
    decision: 'Rank is global on the ladder, with the manuscript''s three channels of mobility.'
    reason: 'Not recorded at the time; the manuscript''s ladder is a single order of jobs.'
    bears_on: ['M2']
  - date: '10 Oct 2026'
    decision: 'Headline and concluding claims are revisited once the model decisions are settled.'
    reason: 'No conclusion is admitted ahead of the rows it would rest on.'
    bears_on: ['M20']
  - date: '10 Oct 2026'
    decision: 'The working papers of Cunha and Heckman and of Gibbons and Waldman are cited as the versions read.'
    reason: 'The published versions were not needed for any claim.'
    bears_on: ['L1', 'L2']
  - date: '11 Oct 2026'
    decision: 'Weber (1978) and Tilly (1998) stay exploration only, and the entry_contest records of them are not adapted.'
    reason: 'No claim rests on either; Cole, Mailath and Postlewaite carry the formal content of the status group.'
    bears_on: ['M47']
  - date: '13 Oct 2026'
    decision: 'The firm is extended simply; pay tied to results is excluded.'
    reason: 'Pay tied to results needs a model of how workers perform differently and a rule for judging them, so the firm would become the object of the paper. Wage pass-through and learning about ability over a career are the grounds for enhancement, with displacement already present.'
    bears_on: ['M38', 'M39']
  - date: '13 Oct 2026'
    decision: 'The firm''s incentive is that it wants workers to upskill rather than choose the lottery, and this principle is to be highlighted as the justification of the firm''s role.'
    reason: 'It is the manuscript''s own accounting, upskilling spending flows back to the firm and lottery spending is diverted from it.'
    bears_on: ['M53', 'M60']
  - date: '13 Oct 2026'
    decision: 'Plain-English blocks (the model summary, the idea summaries, the base case, the players, the questions and answers) stay in step with the claims at all times.'
    reason: 'Prose that drifts from the claims it summarises misleads; the stamps make the drift visible and block the build until the text is reviewed.'
    bears_on: ['M33']
  - date: '15 Oct 2026'
    decision: 'The fallback stays the bottom rung and jobs vacated by downgraders go into the lottery pool.'
    reason: 'The mobility test: the bottom rung keeps the path from the bottom of the ladder to the top open through the lottery for every nondecreasing utility, while a proportional step closes it below the top''s reduced pay (M43, M44). A rule that closed the path would build in the immobility the paper wants to explain through closure.'
    bears_on: ['M32', 'M43', 'M44']
  - date: '15 Oct 2026'
    decision: 'The specific-skill loss measured by Jacobson, LaLonde and Sullivan is kept as the size of the earnings loss on the way to a new job, not as the fallback.'
    reason: 'Their loss is the firm-specific part of pay, which fits a proportional step; the proportional step fails the mobility test, so the measurement stays and the fallback does not follow it.'
    bears_on: ['L26', 'M32']
  - date: '15 Oct 2026'
    decision: 'The manuscript''s "churning at the bottom and stickiness at the top" is a reading of simulations, not a feature to build in.'
    reason: 'The author''s statement of its origin.'
    bears_on: ['M20']
  - date: '15 Oct 2026'
    decision: 'A base case of two displaced workers heads the model section.'
    reason: 'It states the poor-versus-rich mechanism as an instance of the general model, with no risk, no closure and no macro model, so every claim in it is a theorem of the model rather than an approximation.'
    bears_on: ['M42', 'M43', 'M46']
  - date: '16 Oct 2026'
    decision: 'The paper banks on Cole, Mailath and Postlewaite''s idea that the social order touches the economy only through what markets do not allocate, without their marriage model.'
    reason: 'The one allocation of jobs the firm does not make is the lottery, so that is where the status group enters, and the idea gives the paper a formal reference that is read and recorded.'
    bears_on: ['M47', 'L14', 'L15']
  - date: '17 Oct 2026'
    decision: 'The receiving group for the lottery cost was left to tractability and set to the entrant''s own status group in equal shares.'
    reason: 'It balanced every group''s accounts exactly and did not depend on the closure rule. Superseded on 18 Oct 2026 by M58 as now stated, once the lottery was read as making oneself favourable to those above: the cost flows up the ladder to the job holders above the entrant.'
    bears_on: ['M58']
  - date: '19 Oct 2026'
    decision: 'The firm optimises: it chooses the retraining price to maximise profit, receipts from returners less the specific-skill share of the income of jobs filled through the lottery; the ladder is given for now.'
    reason: 'A firm that chooses nothing cannot be a party to the choice between upskilling and the lottery. The retraining price is what the manuscript says the firm sets, and profit with wages fixed varies only through receipts and through who fills each job, which the measured specific-skill share carries. The objective yields the case in which the firm retrains at its own expense, which a receipts-only objective could not.'
    bears_on: ['M61', 'M62', 'M63']
  - date: '19 Oct 2026'
    decision: 'No revenue or production process in the micro model; exploration with endogenous displacement is a macro concern.'
    reason: 'With the ladder and the wage bill fixed, output varies only through who fills each job, so a production function would restate what the specific-skill share already says. Only exploration that makes displacement a choice would change what the firm does, and that belongs with the firm''s dynamics in the macro layer.'
    bears_on: ['M39', 'M61']


model:
  - id: M1
    anchor: 'Appendix, condition 3: "pareto income list x0 (1 - i)^{-1/a} for 1 <= i <= N"'
    claim: '$x_i = x_0(1-i)^{-1/a}$ for $1 \le i \le N$ defines the income ladder'
    assumptions: '$a>0$'
    evidence: 'lean/IscLean/Ladder.lean::Isc.printed_index_base_nonpos. Base $1-i\le 0$ for every $i\ge 1$, so $(1-i)^{-1/a}$ is not a power of a positive base'
