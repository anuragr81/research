    claim: 'The status group $h$ is the categorisation dimension of the manuscript, the order outside the market. It is not priced by the firm, not a function of income or rank, and fixed within a working life, and rank is not a function of it. It acts in the economy at one point only, access to partners in the lottery, which is the one allocation of jobs the firm does not make'
    assumptions: 'two status groups; the aristocratic norm of Cole, Mailath and Postlewaite, status inherited and assigned outside the market, rather than their wealth-is-status norm'
    evidence: 'The manuscript separates adaptability, which the firm prices, from categorisation, which it does not (the anchor). Cole, Mailath and Postlewaite read status as "a ranking device that determines how well he or she fares in the nonmarket sector" (L14 record, CMP92-1, p.1092), not bought, "willingness to make such a payment is not sufficient to guarantee inclusion" (CMP92-3, p.1093), and under the inherited norm leaving market decisions undistorted (CMP92-19, p.1109). The one non-market allocation in this model is the lottery, so the status group enters there (M29) and nowhere else (M28)'
    status: DECIDED
    decision: '16 Oct 2026, the author: the status group is defined by what it governs, access to the non-market allocation of jobs, following the Cole, Mailath and Postlewaite idea that the social order touches the economy only through what markets do not allocate, without their marriage model. Weber stays background, not a source the definition rests on. That a recorded identity is the status group of the model remains a posit (X24)'
