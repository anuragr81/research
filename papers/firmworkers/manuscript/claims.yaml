  - id: M53
    anchor: 'Appendix: "pay a fixed cost that provides mobility with some risk (social lottery)"'
    claim: 'For every nondecreasing $u$ the lottery is worth less at a higher lottery cost, and whoever prefers the return to the lottery still does at any higher lottery cost. So the set of displaced workers who return grows with the lottery cost, and with it, under the source''s accounting, what the firm receives'
    assumptions: 'a pool of two or more; the utility defined at the incomes less either cost'
    evidence: 'lean/IscLean/Mobility.lean::Isc.poolEU_antitone_in_L. Each partner''s former income less the cost falls, and $u$ is nondecreasing, so the average falls (Isc.poolEU_antitone_in_L); the return comparison then persists (Isc.return_keeps_beating_lottery_as_L_rises). The firm''s receipt is the accounting of M38 and the source''s "flows back to the firm"; the lottery cost itself does not reach the firm'
    lean: [Isc.poolEU_antitone_in_L, Isc.return_keeps_beating_lottery_as_L_rises]
    status: LEAN_PROVED
    symbols: [X7, X9, X23, X16]
  - id: M54
    anchor: 'consequence of M43: the exchange window'
    claim: 'Under the bottom rung, an entrant is accepted by the top and accepts the top exactly within the window of former incomes from $x_0+L$ to $x_{top}-L$. The top strictly prefers the downgrade to an entrant below $x_0+L$ for every strictly increasing $u$, so the lottery cost excludes the poorest from the exchange; the window shrinks at both ends as the cost rises and is empty once the cost exceeds half the distance from the bottom income to the top'
    assumptions: 'a pool of two, the top and one entrant; the top''s return no better than the bottom income (M43''s cost condition)'
    evidence: 'lean/IscLean/Mobility.lean::Isc.exchange_window_shrinks. Acceptance by the top needs $x_0\le x_i-L$ (Isc.bottom_rung_top_accepts_entrant) and refusal below it is strict (Isc.top_refuses_below_floor); acceptance of the top needs $x_i\le x_{top}-L$ (Isc.entrant_accepts_top). The window at a higher cost is contained in the window at a lower one (Isc.exchange_window_shrinks), is empty when $x_{top}-x_0<2L$ (Isc.exchange_window_empty), and is the whole ladder at zero cost (Isc.control_window_full_at_zero_cost)'
    lean: [Isc.exchange_window_shrinks, Isc.exchange_window_empty, Isc.top_refuses_below_floor, Isc.control_window_full_at_zero_cost]
    status: LEAN_PROVED
    symbols: [X7, X3, X15, X9]
  - id: M55
    anchor: 'issue 14, a pool of one'
    claim: 'The lottery is unavailable to a lone entrant, who chooses between the return and the downgrade. The steady state assumes an economy large enough that a pool of fewer than two entrants is negligible'
    assumptions: ''
    evidence: 'lean/IscLean/Economy.lean::Isc.voidPool_tendsto_zero. The only former job in a pool of one is the entrant''s own, which M36 does not hand back. The chance of a pool of fewer than two tends to zero as the number of workers grows (M56), and the rule does not change who enters (M57). Giving the lone entrant the own former job back at the lottery cost would undercut the return whenever the lottery cost is below the upskilling cost, and the firm would receive nothing (M52)'
    status: DECIDED
    decision: '17 Oct 2026, the author: option (a) of issue 14, with the large-economy assumption put into Lean'
    affects: [M24, M30, M33, M36, M39, M52]
    symbols: [X23, X28]
  - id: M56
    anchor: 'consequence of M39 and M55: the large economy'
    claim: 'If each of $n$ workers enters the lottery independently with the same chance $q$, $0<q<1$, the chance of a pool of fewer than two entrants, $(1-q)^n+nq(1-q)^{n-1}$, tends to zero as $n$ grows'
    assumptions: 'independent entry with a common chance $q$, as uniform displacement at rate $d$ gives for the workers in ranks that choose the lottery'
    evidence: 'lean/IscLean/Economy.lean::Isc.voidPool_tendsto_zero. The chance is the sum of the binomial terms for no entrant and one entrant, and all binomial terms sum to one (Isc.voidPool_binomial_terms); the first term is a geometric sequence and the second a constant times $n(1-q)^n$, both tending to zero. Control: with two workers and $q=1/2$ the chance is $3/4$ (Isc.control_void_pool_likely_when_small)'
    lean: [Isc.voidPool_tendsto_zero, Isc.voidPool_binomial_terms, Isc.control_void_pool_likely_when_small]
    status: LEAN_PROVED
    symbols: [X23, X28]
  - id: M57
    anchor: 'consequence of M55: the rule for a pool of one in larger pools'
    claim: 'Under M55 the chance of an empty pool does not change who enters: a displaced worker who enters and finds no partner takes the route it would otherwise have chosen, so entering is at least as good as that route exactly when the draw is. The rule of M52 would instead give the lottery a guaranteed minimum that the return lacks and draw more workers into the lottery in pools of every size'
    assumptions: 'a chance of an empty pool below one; values compared by expected utility'
    evidence: 'lean/IscLean/Economy.lean::Isc.void_rule_neutral. $A\le\pi A+(1-\pi)D\iff A\le D$ for $\pi<1$. Control: under M52''s rule, with the lone entrant''s own job worth $8$, the alternative $5$ and the draw $4$, the lottery is entered at $\pi=1/2$ although its draw is worse (Isc.control_cheap_lone_rule_distorts)'
    lean: [Isc.void_rule_neutral, Isc.control_cheap_lone_rule_distorts]
    status: LEAN_PROVED
    symbols: [X23, X7, X16]
  - id: M58
    anchor: 'Section 2: "all income circulates between workers and firm"; Introduction: "consumption as a mechanism of social mobility"'
    claim: 'The lottery cost stays among workers and flows up the ladder. Each entrant pays it to the job holders strictly above the entrant''s former rank, in equal shares; an entrant with no job holder above pays all job holders equally. The job holders receive in total the number of entrants times the lottery cost, a job holder''s receipts rise with rank, and a job holder with no entrant below receives nothing'
    assumptions: 'at least one job holder; ranks as a function of workers'
    evidence: 'lean/IscLean/Economy.lean::Isc.dues_total. Each entrant''s cost is received in full by the holders above it, or by all holders when none is above (Isc.dues_of_entrant), so the total is the number of entrants times the cost (Isc.dues_total); a holder of higher rank receives at least as much from every entrant (Isc.dues_mono); a holder with no entrant below receives nothing (Isc.dues_bottom_zero). Controls: with the entrant at the bottom of four ranks each of the three holders above receives a third (Isc.control_dues_example); an entrant at the top pays the three holders below a third each (Isc.control_dues_top_entrant_fallback). The manuscript''s lottery is Goode''s consumption as a mechanism of mobility, spending that makes a worker favourable to those above, and the costs of social ties are "borne by workers" and do not reach the firm'
    lean: [Isc.dues_total, Isc.dues_of_entrant, Isc.dues_mono, Isc.dues_bottom_zero, Isc.control_dues_example, Isc.control_dues_top_entrant_fallback]
    status: DECIDED
    decision: '18 Oct 2026, the author: the lottery is a means of mobility in which displaced workers make themselves favourable to those above them, so the lottery cost goes to the job holders strictly above the entrant''s former rank, shared equally. This supersedes the own-group rule of 17 Oct 2026. The fallback for an entrant with nobody above, equal shares to all job holders, is the smallest rule that avoids a leak; proposed by the assistant on 18 Oct 2026 and accepted by the author the same day'
    affects: [M46, M52, M53, M54, M59, M60, M66]
    symbols: [X7, X2, X6]
  - id: M59
    anchor: 'consequence of M58'
    claim: 'A receipt that does not depend on one''s own route leaves every comparison of sure routes unchanged and leaves the lottery-over-downgrade result of M33 holding for every nondecreasing $u$. So the receipts of M58 change no result that rests on first-order dominance or on valuing income at its average'
    assumptions: 'results that compare utilities of shifted incomes beyond dominance may change through wealth effects and are not covered'
    evidence: 'lean/IscLean/Economy.lean::Isc.receipt_preserves_dominance. Shifting every income by the receipt keeps M33''s condition, so M33 applies to the shifted incomes (Isc.receipt_preserves_dominance); sure comparisons are unchanged (Isc.receipt_preserves_sure_comparison)'
    lean: [Isc.receipt_preserves_dominance, Isc.receipt_preserves_sure_comparison]
    status: LEAN_PROVED
    symbols: [X7, X9, X3]
  - id: M60
    anchor: 'consequence of M38 and M58: one choice, three interests'
    claim: 'The entrant compares the return, worth the former income less the upskilling cost, with the lottery, worth its expected prize less the lottery cost. The job holders above the entrant receive the lottery cost, so workers taken together recover it, the lottery is worth its expected prize to them, and whenever the entrant prefers the lottery they do too, while the entrant can prefer the return where they would prefer the lottery. The firm receives the upskilling cost from a returner and nothing from an entrant, so it prefers the return whatever the lottery cost. One choice thus pays either the firm or the job holders above'
    assumptions: 'valuing income at its average; workers taken together count the lottery cost as a transfer among them (M58)'
    evidence: 'lean/IscLean/Economy.lean::Isc.workers_prefer_lottery_whenever_entrant_does. Control: former income $10$, upskilling cost $3$, expected prize $8$, lottery cost $2$; the return is worth $7$, the lottery $6$ to the entrant and $8$ to workers taken together (Isc.control_entrant_returns_where_workers_would_gamble). The firm''s preference (Isc.firm_prefers_return) is the source''s accounting, upskilling spending "flows back to the firm"'
    lean: [Isc.workers_prefer_lottery_whenever_entrant_does, Isc.control_entrant_returns_where_workers_would_gamble, Isc.firm_prefers_return]
    status: LEAN_PROVED
    symbols: [X7, X16, X6]
  - id: M61
    anchor: 'Section 2: "firms set training costs and wage differentials"; Appendix: "Higher $b$ corresponds to higher costs (charged by the firm"'
    claim: 'The firm chooses the retraining price $\kappa$, the scale of the upskilling cost, to maximise profit per displaced cohort: receipts from returners, $\kappa(x_i-x_0)^b$ each, less the specific-skill share $\delta$ of the income of every job filled through the lottery. The exponent $b$ is technology, the ladder is given with its wage bill fixed, and the lottery cost is a social cost the firm does not set'
    assumptions: 'the first approximation of M40, a common continuation value; under M33''s condition every displaced worker outside the return band enters the lottery'
    evidence: 'lean/IscLean/Firm.lean::Isc.band_antitone_in_price. The manuscript has the firm setting training costs and charging them; its macro objective is the share of wages that returns as upskilling (line 258). Output is implicit in the ladder''s incomes, and the only output object is $\delta$, what a job loses when filled by someone without its specific skills (L26, JLS-3, JLS-43), so receipts less that loss is the firm''s profit once wages are fixed. Exploration with endogenous displacement is left to the macro layer, since a revenue process that does not change what the firm chooses adds nothing to the micro model'
    lean: [Isc.band_antitone_in_price]
    status: DECIDED
    decision: '19 Oct 2026, the author: the firm must optimise something. The retraining price is its instrument (line 105 over line 110), profit as stated is its objective, the ladder is given for now and its choice is the next step; a revenue process is not added, because with the ladder and the wage bill fixed output varies only through who fills each job, which $\delta$ already carries; exploration with endogenous displacement is a macro concern'
    affects: [M7, M35, M38, M53, M60]
    symbols: [X30, X16, X5, X6, X3, X7]
  - id: M62
    anchor: 'consequence of M61'
    claim: 'A higher retraining price shrinks the band of ranks that return, a dearer lottery enlarges it, the firm receives nothing at a zero price and nobody returns once the price exceeds every rank''s reservation, so profit has an interior optimum; and at any fixed price profit is nondecreasing in the lottery cost'
    assumptions: 'incomes at or above the bottom income; a nonnegative price and specific-skill share'
    evidence: 'lean/IscLean/Firm.lean::Isc.band_antitone_in_price. The band at a higher price is contained in the band at a lower one (Isc.band_antitone_in_price); at a higher lottery cost the band contains the old one (Isc.band_grows_with_lottery_cost); receipts vanish at a zero price (Isc.receipts_zero_at_zero_price) and the band is empty above every reservation (Isc.band_empty_above_reservations); receipts rise with the band and the lottery loss falls with it (Isc.profit_nondecreasing_in_lottery_cost). Control: a negative price enlarges the band (Isc.control_lower_price_keeps_band). The optimal price itself need not rise with the lottery cost (M69)'
    lean: [Isc.band_antitone_in_price, Isc.band_grows_with_lottery_cost, Isc.receipts_zero_at_zero_price, Isc.band_empty_above_reservations, Isc.profit_nondecreasing_in_lottery_cost, Isc.control_lower_price_keeps_band]
    status: LEAN_PROVED
    symbols: [X30, X7, X16, X6]
  - id: M63
    anchor: 'consequence of M61: the subsidy case'
    claim: 'A displaced worker whose own job is worth less than the lottery returns at a zero price only if paid the difference, $V-L-x_i$. The firm gains from paying it exactly when the payment is below the specific-skill loss of letting a stranger fill the job, that is when $V-L<(1+\delta)x_i$. So the firm subsidises the retraining of the ranks just below the lottery''s value and lets the ranks below $(V-L)/(1+\delta)$ enter the lottery'
    assumptions: 'valuing income at its average; the firm''s loss on a lottery-filled job is $\delta$ times its income'
    evidence: 'lean/IscLean/Firm.lean::Isc.subsidy_worthwhile_iff. The payment restores the return to the lottery''s worth (Isc.subsidy_restores_return). Control: with $\delta=1/4$ and a lottery worth $2$, a job paying $9/5$ is subsidised and a job paying $1$ is not (Isc.control_subsidy_covers_near_mean_not_bottom). This is the case in which the firm retrains at its own expense rather than charging, Becker''s specific-training result in the model''s terms'
    lean: [Isc.subsidy_worthwhile_iff, Isc.subsidy_restores_return, Isc.control_subsidy_covers_near_mean_not_bottom]
    status: LEAN_PROVED
    symbols: [X30, X7, X6]
  - id: M64
    anchor: 'the closure rule for M29 after M37 (issue 17)'
    claim: 'Closure is realised by a two-stage draw. With chance $\sigma$ a displaced entrant''s connections reach only the own status group, so the entrant''s former job is reassigned among the own group''s such entrants; otherwise the entrant joins the joint draw. A lottery left with fewer than two members merges into the joint one, and if the joint one is then left with fewer than two, all entrants form one lottery. Every lottery reassigns its members'' former jobs as in M36'
    assumptions: 'two status groups; the same $\sigma$ for both'
    evidence: 'lean/IscLean/TwoStage.lean::Isc.two_stage_within_chance. In the pool of two from each group the rule gives the within-group partner chance $(1-\sigma^2)^2/3+\sigma^2(2-\sigma^2)$ and the no-crossing chance $(1-\sigma^2)^2/9+\sigma^2(2-\sigma^2)$ (M48, M49), both from the no-closure value to one, and the expected-gap recursion of M51. Feasible for any group sizes, which M29''s per-entrant weights are not (M37); $\sigma$ reads as the share of displaced workers whose courting stays within the group, Coleman''s inbreeding homophily in large pools (M68); the rich receive and do not choose, as issue 16 decided. Proved since the decision: feasibility for any group sizes (M65), M58 refined to the job holders the entrant reaches (M66), the large-pool gap recursion and half-life (M67), and $\sigma=IH$ in large pools (M68)'
    lean: [Isc.two_stage_within_chance, Isc.two_stage_no_cross_chance, Isc.two_stage_gap_recursion]
    status: DECIDED
    decision: '19 Oct 2026, the author: option (a) of issue 17 for this paper, because it covers unequal groups, determines the persistence of a gap between the groups, and keeps the rich as receivers rather than choosers. Options (b) and (c) are recorded in ISSUES'
    affects: [M25, M26, M27, M29, M45, M48, M49, M51, M58, M65, M66, M67, M68]
    symbols: [X25, X24, X8]
  - id: M65
    anchor: 'consequence of M64 (issue 17b)'
    claim: 'The two-stage draw is feasible for any group sizes and any $\sigma$. Whatever the first stage gives, every lottery has two or more members when the pool has, and some reassignment gives every entrant another member''s former job in the entrant''s lottery; an own lottery holds only the group''s entrants, so its reassignments keep jobs in the group; the chances of the first stage sum to one'
    assumptions: 'a pool of two or more entrants; any number of status groups'
    evidence: 'lean/IscLean/GroupDraw.lean::Isc.two_stage_feasible. The last merge leaves no lottery of one (Isc.lottery_has_two); each lottery''s members in a cycle give the reassignment (Isc.exists_reassignment_within); own lotteries stay in the group (Isc.own_lottery_within_group); the binomial sum is one (Isc.stage_one_chances_sum). Controls: with two entrants of one group in the own lottery and one of the other, the joint lottery would hold one member and the last merge forms one lottery of three (Isc.control_last_merge_needed); a lone entrant can receive only the own former job (Isc.control_feasibility_needs_two)'
    lean: [Isc.two_stage_feasible, Isc.lottery_has_two, Isc.exists_reassignment_within, Isc.own_lottery_within_group, Isc.stage_one_chances_sum, Isc.control_last_merge_needed, Isc.control_feasibility_needs_two]
    status: LEAN_PROVED
    symbols: [X25, X24, X8]
  - id: M66
    anchor: 'M58 refined under M64 (issue 17a)'
    claim: 'An entrant pays the lottery cost to the job holders strictly above the entrant''s former rank among those the entrant''s connections reach, the own status group''s job holders after the own lottery and all job holders after the joint one, with M58''s fallback within the same set. Nothing leaks, receipts rise with rank among job holders reached alike, and when every entrant reaches only the own group, as under full closure, each group''s job holders receive exactly the group''s entrants times the lottery cost. Below full closure the lottery cost crosses the groups only through entrants of the joint lottery'
    assumptions: 'every entrant reaches at least one job holder; the reading of M64''s first stage under issue 16, that a worker courts those the worker''s connections reach'
    evidence: 'lean/IscLean/GroupDraw.lean::Isc.duesReach_total. When every entrant reaches all job holders the rule is M58 (Isc.duesReach_eq_dues); the total is the number of entrants times the cost (Isc.duesReach_total); a set of job holders each entrant reaches wholly or not at all receives the cost of the entrants reaching it (Isc.duesReach_group), which gives the within-group balance under full closure (Isc.full_closure_dues_within_group); monotone in rank (Isc.duesReach_mono). Control: an entrant at rank 0 reaching only the own job holder at rank 1 pays it the whole cost and the other group''s holder at rank 2 nothing, while reaching both pays each half (Isc.control_reach_decides_who_is_paid). The own-group rule superseded on 18 Oct returns as the full-closure case'
    lean: [Isc.duesReach_total, Isc.duesReach_eq_dues, Isc.duesReach_group, Isc.full_closure_dues_within_group, Isc.duesReach_mono, Isc.control_reach_decides_who_is_paid]
    status: LEAN_PROVED
    symbols: [X7, X25, X24, X2]
  - id: M67
    anchor: 'consequence of M64 and M50 in a large pool (issue 17c)'
    claim: 'In a large pool the gap between the two status groups'' mean incomes is multiplied by $1-(1-\sigma)d$ each period, whatever the groups'' sizes, while the pool''s mean is unchanged; so below full closure the gap vanishes, and under full closure it persists entire. Its exact half-life is $\ln 2/(-\ln(1-(1-\sigma)d))$ periods, below the approximation $\ln 2/((1-\sigma)d)$ by at most $\ln 2$'
    assumptions: 'a large pool, so a lottery''s jobs have the mean of the jobs vacated into it and own lotteries have two or more members; entry into the lottery at a rate $d$ that does not depend on rank or group'
    evidence: 'lean/IscLean/GroupDraw.lean::Isc.large_pool_gap_step. A share $1-d$ of a group''s jobs is not entered, a share $d\sigma$ is reassigned within the group and keeps its former jobs, and a share $d(1-\sigma)$ draws from the joint lottery at the pool''s mean (Isc.nextMean); the pool''s mean is conserved (Isc.large_pool_mean_conserved), the gap recursion holds (Isc.large_pool_gap_step) and iterates (Isc.large_pool_gap); limits Isc.large_pool_gap_vanishes, Isc.large_pool_gap_full_closure; half-life Isc.halfLife_halves, bounds Isc.halfLife_bounds. Controls: a gap halved each period has half-life one period where the approximation gives about $1.39$ (Isc.control_halfLife_approximation_overstates); with every worker entering and no closure the large pool removes the gap in one period while the pool of two and two reverses it to a third (Isc.control_small_pool_differs, M51)'
    lean: [Isc.large_pool_gap_step, Isc.large_pool_mean_conserved, Isc.large_pool_gap, Isc.large_pool_gap_vanishes, Isc.large_pool_gap_full_closure, Isc.halfLife_halves, Isc.halfLife_bounds, Isc.control_halfLife_approximation_overstates, Isc.control_small_pool_differs]
    status: LEAN_PROVED
    symbols: [X25, X24, X28, X6]
  - id: M68
    anchor: 'consequence of M64 in a large pool (issue 17d)'
    claim: 'In a large pool an entrant of a status group with share $w$ among entrants receives a former job of the own group with chance $\sigma+(1-\sigma)w$, and Coleman''s inbreeding homophily index of that chance is exactly $\sigma$, for every group share. In a joint lottery of $n$ members the own group''s share among the others tends to $w$, so the index tends to $\sigma$ as the pool grows. Closure is therefore the inbreeding homophily of job-finding connections, while the own-group share itself depends on the group''s size'
    assumptions: 'a large pool, as in M67; entry into the lottery that does not depend on group, so a group''s share among entrants is its share of workers'
    evidence: 'lean/IscLean/GroupDraw.lean::Isc.closure_is_inbreeding_homophily, with the index as defined in the literature record (CurrariniJacksonPin2009.inbreeding, L24). The joint lottery''s own-group share tends to $w$ (Isc.joint_own_share_tendsto) and the index tends to $\sigma$ (Isc.inbreeding_tendsto_closure). Control: at $\sigma=1/2$ groups of a quarter and of half the entrants draw own-group jobs with chances $5/8$ and $3/4$, and the index is $1/2$ for both (Isc.control_share_differs_index_same)'
    lean: [Isc.closure_is_inbreeding_homophily, Isc.joint_own_share_tendsto, Isc.inbreeding_tendsto_closure, Isc.control_share_differs_index_same]
    status: LEAN_PROVED
    symbols: [X25, X24]
  - id: M69
    anchor: 'consequence of M61'
    claim: 'The optimal retraining price need not rise with the lottery cost. On a ladder of two ranks, a dearer lottery can make the firm switch from a high price at which only the top rank returns to a lower price at which both return, because the dearer lottery makes the bottom rank cheaper to keep'
    assumptions: 'as M61; the example has ranks paying $1$ and $4$, bottom income $0$, $b=1$, a lottery prize worth $1$ and $\delta=1/4$'
    evidence: 'lean/IscLean/Firm.lean::Isc.optimal_price_can_fall_with_lottery_cost. At lottery cost $1/2$ the price $7/8$ is optimal and only the top rank returns; at lottery cost $4/5$ every price at or above $7/8$ earns less than $4/5$, at which both ranks return (profit evaluated by Isc.two_rank_profit). Profit rises with the lottery cost at any fixed price (M62), but the optimum can jump down, because the band changes by whole ranks'
    lean: [Isc.optimal_price_can_fall_with_lottery_cost, Isc.two_rank_profit]
    status: LEAN_PROVED
    symbols: [X30, X7, X6]

