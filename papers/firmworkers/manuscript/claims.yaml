  - id: M28
    anchor: 'Introduction: "a long-term social categorisation derived from language, nationality, religion, or political identity"'
    claim: 'Human capital $h$ is a categorical status label, fixed within a working life'
    assumptions: ''
    evidence: 'The manuscript says categorisation evolves far more slowly than adaptability. Decided as a label without a law of motion inside the micro model'
    status: DECIDED
    decision: '11 Oct 2026, the author. $h$ is social standing in the non-contractual order, observed by firms but not priced; it is fixed within a working life and its evolution belongs to the intergenerational layer. Cole, Mailath and Postlewaite (1992), aristocratic equilibrium, is the formal reference. Merging the upskilling cost into $h$ is rejected because it would let the firm govern social rank'
    affects: [M25, M26, M27, M29]
    symbols: [X24]
  - id: M29
    anchor: 'Introduction: "the economic interactions in the model treat social networks as an essential mechanism"'
    claim: 'Categorical friction enters the social contest as one closure parameter $\sigma\in[0,1]$ that scales down the weight of a draw across status groups to $1-\sigma$'
    assumptions: ''
    evidence: 'The manuscript gives no form for friction. Decided in the simplest form, with its limitations stated in the decision'
    status: DECIDED
    decision: '11 Oct 2026, the author, on the condition that its limitations are stated. The form is one parameter, two status groups, and the same closure for both groups (symmetric weights); it is exogenous, not chosen by either group; it acts only on partner draws inside the entrant pool, not on the job ladder, which stays the market order; there is no network structure within a group; and $\sigma>1$ is excluded because cross-group weights would turn negative. Asymmetric closure, in which one group hoards access against the other, is outside this form'
    affects: [M25, M26, M27]
    symbols: [X8, X24, X25]
  - id: M30
    anchor: 'consequence of the entrant pool decided in M14'
    claim: 'For every expected-utility entrant whose $u$ is strictly increasing on the incomes involved, and $L>0$, the richest entrant of any pool of two or more strictly prefers to stay out, so no such pool is stable whatever the curvature of $u$'
    assumptions: '$|P|\ge 2$, $L>0$, partner uniform over the other entrants (M14), outcome $x_k-L$, $u$ strictly increasing on a set containing every $x_k$ and $x_k-L$'
    evidence: 'lean/IscLean/Unravelling.lean::Isc.richest_entrant_prefers_out. Every outcome of the richest entrant, $x_k-L$, lies strictly below $x_i$, so staying out dominates entry in the first-order sense and no concavity or convexity of $u$ enters. Under M32 the alternative of a displaced worker is the downgrade, not $x_i$, so M30 says that no worker who keeps the job enters the lottery voluntarily, not that a pool of displaced workers unravels (M33). With $u$ the identity the expected utility is the pool gain of M11 plus $x_i$ (Isc.poolEU_id), so M24 is the risk-neutral case'
    lean: [Isc.richest_entrant_prefers_out, Isc.no_stable_pool, Isc.poolEU_id]
    status: LEAN_PROVED
    symbols: [X7, X9, X18, X22, X23]
  - id: M31
    anchor: 'consequence of the closure form decided in M29'
    claim: 'Closure does not rescue the pool: for $\sigma<1$ and every strictly increasing $u$, the richest entrant of any pool of two or more strictly prefers to stay out under closure-weighted draws'
    assumptions: '$|P|\ge 2$, $L>0$, $\sigma<1$, $u$ strictly increasing on a set containing every $x_k$ and $x_k-L$'
    evidence: 'lean/IscLean/Unravelling.lean::Isc.richest_entrant_prefers_out_closure. Weights $1$ and $1-\sigma$ are positive, so the closure-weighted expected utility is an average of values each below $u(x_i)$. At $\sigma=1$ the pool splits into group pools (M26), to each of which M30 applies'
    lean: [Isc.richest_entrant_prefers_out_closure]
    status: LEAN_PROVED
    symbols: [X7, X9, X25]
  - id: M32
    anchor: 'Appendix: "a displaced worker can return to the previous job by investing in the skills or certifications required to perform it"'
    claim: 'Lottery entrants are displaced workers. A displaced worker who does nothing falls to the bottom rung $x_0$, and the prize of the lottery is the former position of another displaced worker'
    assumptions: ''
    evidence: 'The manuscript says a worker who loses a job chooses among the downgrade, a costly return and the lottery, but gives no income for the worker who does nothing. With $C(x_0,x_i)=(x_i-x_0)^b$ the return is costly only if displacement first lowers the worker below $x_i$. Decided for the bottom rung, which adds no parameter'
    status: DECIDED
    decision: '12 Oct 2026, the author, reading (a) of three (bottom rung, proportional step, best vacated position below). The skills of the lost job are worth nothing on the ladder; every displaced worker has the same fallback $x_0$; there is no unemployment spell; displacement is exogenous, the creative destruction of the source. Under the pool of M14 the losers of a swap are other displaced workers, never incumbents, a departure from the manuscript, where the partner is "someone else in the job-market"'
    affects: [M20, M30, M33, M34, M35]
    symbols: [X3, X22, X23]
  - id: M33
    anchor: 'consequence of the displacement decided in M32'
    claim: 'If every entrant''s former income less $L$ is at least the fallback $x_0$, every displaced entrant weakly prefers the lottery to the downgrade, for every nondecreasing $u$. A pool of displaced workers can be stable without any curvature of $u$'
    assumptions: '$|P|\ge 2$, partner uniform over the other entrants (M14), outcome $x_k-L$, $L\le x_k-x_0$ for every $k\in P$, $u$ nondecreasing on a set containing $x_0$ and every $x_k-L$'
    evidence: 'lean/IscLean/Displacement.lean::Isc.displaced_prefer_lottery. Every outcome of the lottery is at least $x_0$, so the lottery dominates the downgrade in the first-order sense. Under risk neutrality the lottery is worth the mean former income of the other entrants less $L$ (Isc.poolEU_id_avg)'
