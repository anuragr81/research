    status: ILL_POSED
    repaired_by: [M2, M3, M4]
    symbols: [X1, X3, X4]
  - id: M2
    anchor: 'repair of M1 with a quantile index'
    claim: '$x(q)=x_0(1-q)^{-1/a}$ is strictly increasing in $q$'
    assumptions: '$x_0>0$, $a>0$, $q_1<q_2<1$'
