    symbols: [X27, X3, X16]
  - id: M39
    anchor: 'Appendix: "the workers in the economy face temporary job loss"; footnote: "triggered by uniform displacements"'
    claim: 'Every worker lives forever on the fixed ladder and is in one of two states, holding a job or displaced. Each period a job holder is displaced with the same chance $d$, whatever the rank. A displaced worker chooses a route and holds a job again next period. The object of the model is the steady state of this process, and routes are compared by lifetime value, the discounted expected income over the rest of a working life'
    assumptions: ''
    evidence: 'lean/IscLean/SteadyState.lean::Isc.holdValue_recursion. The value $V(x)$ of holding a job paying $x$ satisfies $V(x)=x+\beta((1-d)V(x)+dW)$, with $W$ the value of being displaced, which is the same whichever route led there because every displaced worker holds a job again next period (Isc.holdValue_recursion); $V$ rises with $x$ (Isc.holdValue_mono), so every comparison of routes that holds for any nondecreasing utility of income carries over. The Lean takes $W$ as the same from every job; in the model as decided it depends on the job held, since the return regains that job''s income, so the exact lifetime value is a fixed point $W(x)=\max$ over the three routes, not yet in Lean, and M40 and M41 are its first approximation. The manuscript assumes temporary job loss, no long-term unemployment and uniform displacement, and its macro model looks for a steady state'
    lean: [Isc.holdValue_recursion, Isc.holdValue_mono]
    status: DECIDED
    decision: '14 Oct 2026, the author: one type of player, the worker, in two states, since with infinitely lived workers on a fixed ladder the difference between a job holder and a displaced worker is not significant in the steady state; uniform displacement for simplicity, so a job holder can do nothing to protect the job and the source''s "less likelihood of being replaced" is dropped; the steady state replaces the one-shot comparison of Q5 as the object of the micro model. Open: the rule that fills jobs vacated by downgraders (issue 12) and whether route costs are paid once (issue 13)'
    affects: [M20, M21, M22, M23, M30, M32, M33, M34, M35, M38]
    symbols: [X28, X29, X1]
  - id: M40
