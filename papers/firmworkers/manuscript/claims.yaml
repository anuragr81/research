  - id: M38
    anchor: 'Appendix: "a displaced worker can return to the previous job by investing in the skills or certifications required to perform it"'
    claim: 'A displaced worker who takes the return regains the former job, which stays on the ladder, vacant, after displacement, and pays the upskilling cost $C(f,x_i)$ of climbing from the income $f$ of the downgrade back to the former income $x_i$. The firm receives the payment. Under M32, $f=x_0$, so the return is worth $x_i-(x_i-x_0)^b$'
    assumptions: ''
    evidence: 'The manuscript lists "costly investment to move upward" among three mechanisms and gives the return to the previous job as its instance (the anchor). It formalises the mechanism as a pairing of workers, "pay the skill cost required to claim a higher-ranked position from someone willing to step down"; whether the return should also cover that market is issue 10. The job must survive displacement, because the return regains it and the lottery awards the former jobs of entrants (M36), and the number of jobs is fixed ("the number of jobs does not change over time"). The climb starts at the income of the downgrade, because the cost $C(x_0,x_i)$ of M7 is paid only if displacement first lowers the worker (M32). The firm receives the payment, "Higher b corresponds to higher costs (charged by the firm". The scale of the cost is issue 1 (M35)'
    status: DECIDED
    decision: '14 Oct 2026, the author: the return is defined as stated, so the term no longer rests on a result (M35). The vacated jobs of downgraders still need a refill rule (M23)'
