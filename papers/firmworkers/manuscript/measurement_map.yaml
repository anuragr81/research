meta:
  title: 'Inequality and Social Contests: measurement map'
  scope: 'Micro model only. Macro variables deferred.'
  pass: 2

support_status:
  LITERATURE: 'a literature claim uses the variable with this real-world meaning'
  POSIT: 'the paper''s own identification, supported by nothing else in the ledger'
  NONE: 'modelling device with no real-world referent'

observation_status:
  PROPOSED: 'how an observer could obtain the object, proposed and awaiting the author''s confirmation'
  CONFIRMED: 'confirmed by the author'

rows:
  - id: X1
    symbol: '$N$'
    role: input
    meaning: 'number of workers, equal to the number of jobs'
    referent: 'size of the labour market'
    support: POSIT
    direction: ''
    observation: 'count of jobs in the market studied, from a job-title register or a matched employer-employee panel'
    observation_status: PROPOSED

  - id: X2
    symbol: '$q\in[0,1)$'
    role: input
    meaning: 'rank quantile of a job on the ladder'
    referent: 'percentile of a job in the wage ranking'
    support: POSIT
    direction: 'higher $q$ is a better-paid job (M2)'
    observation: 'percentile of the job''s wage in the wage distribution of the same market, from payroll or matched employer-employee data'
    observation_status: PROPOSED

  - id: X3
    symbol: '$x_0$'
    role: input
    meaning: 'income at $q=0$'
    referent: 'lowest wage'
    support: POSIT
    direction: ''
    observation: 'lowest wage of the market, read as a low percentile of the wage distribution in payroll data'
    observation_status: PROPOSED

  - id: X4
    symbol: '$a$'
    role: input
    meaning: 'tail index of the income ladder $x(q)=x_0(1-q)^{-1/a}$'
    referent: 'income dispersion across ranks, inversely'
    support: POSIT
    direction: 'higher $a$ lowers income at every interior quantile (M3) and narrows every income gap (M4), so higher $a$ means a more equal ladder'
    observation: 'Pareto index of the upper tail of the wage distribution, estimated by regressing log rank on log wage'
    observation_status: PROPOSED

  - id: X5
    symbol: '$b$'
    role: input
    meaning: 'exponent of the upward-move cost $C(m_i,m_k)=(m_k-m_i)^b$'
    referent: 'convexity of retraining cost in the income distance climbed'
    support: POSIT
    direction: 'for $b\ge1$ two adjacent steps cost no more than the jump (M8). For $0\le b\le1$ the jump costs no more than the steps (M9)'
    observation: 'growth of retraining cost (tuition and earnings forgone while retraining) with the wage gap between origin and destination job, from training records linked to job moves'
    observation_status: PROPOSED

  - id: X6
    symbol: '$m$'
    role: input
    meaning: 'income of a position, written $x$ on the ladder'
    referent: 'wage of a job'
    support: POSIT
    direction: ''
    observation: 'wage of the job, from payroll data'
    observation_status: PROPOSED

  - id: X7
    symbol: '$L$'
    role: input
    meaning: 'fixed cost of entering the lottery'
    referent: 'cost of social navigation, such as networking, club membership and compliance with social closure'
    support: POSIT
    direction: 'higher $L$ lowers the participation threshold (M13)'
    observation: 'spending on social navigation such as membership fees and networking time, from expenditure or time-use surveys'
    observation_status: PROPOSED

  - id: X8
    symbol: 'swap rule'
    role: input
    meaning: 'a lottery entrant $i$ swaps positions with a partner $k$ drawn uniformly from the other entrants (M14, decided 10 Oct 2026); cross-group draws to be weighted by categorical friction'
    referent: 'a social contest that reallocates jobs by connection or luck rather than by skill'
    support: POSIT
    direction: ''
    observation: 'not observed directly; its implication is a rank change after job loss that is unrelated to the worker''s own rank, testable on the distribution of rank changes in panel data'
    observation_status: PROPOSED

  - id: X9
    symbol: '$u$'
    role: input
    meaning: 'utility over income in expected-utility form, unique up to a positive affine transformation (decision of 10 Oct 2026), S-shaped in the manuscript, functional form not given'
    referent: 'attitude to income risk, risk-seeking below a reference income and risk-averse above it'
    support: POSIT
    direction: ''
    observation: 'not measured; a construct that rationalises recorded choices between the lottery route and the downgrade at each income'
    observation_status: PROPOSED

  - id: X10
    symbol: '$\bar y$'
    role: input
    meaning: 'mean of net income from the lottery component'
    referent: 'expected income'
    support: POSIT
    direction: ''
    observation: 'mean income change of workers who take the lottery route, from panel data'
    observation_status: PROPOSED

  - id: X11
    symbol: '$\sigma_y$'
    role: input
    meaning: 'standard deviation of net income from the lottery component'
    referent: 'income risk created by taking part in social contests'
    support: POSIT
    direction: ''
    observation: 'standard deviation of that income change, from panel data'
    observation_status: PROPOSED

  - id: X12
    symbol: '$\varepsilon$'
    role: input
    meaning: 'standardised shock, $\mathbb{E}\varepsilon=0$, $\mathbb{E}\varepsilon^2=1$'
    referent: ''
    support: NONE
    direction: ''
    observation: ''

  - id: X13
    symbol: '$s$'
    role: input
    meaning: 'scale in $\sigma_y=s(1-\lambda)m$'
    referent: 'income risk per unit of income staked on social contests'
    support: POSIT
    direction: ''
    observation: 'ratio of the income risk of the lottery route to the income staked, compared across income levels in panel data'
    observation_status: PROPOSED

  - id: X14
    symbol: '$\lambda$'
    role: input
    meaning: 'share of income allocated to upskilling, with $1-\lambda$ allocated to the lottery'
    referent: 'share of resources spent on human capital rather than on social navigation'
    support: POSIT
    direction: ''
    observation: 'share of spending on training or certification against spending on social navigation, from expenditure or time-use surveys'
    observation_status: PROPOSED

  - id: X15
    symbol: '$x(q)$'
    role: output
    produced_by: [M2]
    meaning: '$x_0(1-q)^{-1/a}$'
    referent: 'wage of the job at percentile $q$'
    support: POSIT
    direction: 'increasing in $q$ (M2), decreasing in $a$ (M3)'
    observation: 'wage at percentile q of the wage distribution, from payroll data'
    observation_status: PROPOSED

  - id: X16
    symbol: '$C(m_i,m_k)$'
    role: output
    produced_by: [M7]
    meaning: '$(m_k-m_i)^b$ if $m_i<m_k$, $0$ otherwise'
    referent: 'retraining cost of moving from job $i$ up to job $k$'
    support: POSIT
    direction: 'zero for downward and lateral moves (M7)'
    observation: 'retraining cost of an observed upward move, from training records and earnings forgone'
    observation_status: PROPOSED

  - id: X17
    symbol: '$S$'
    role: output
    produced_by: [M10]
    meaning: '$\sum_k x_k$'
    referent: 'total wage bill'
    support: POSIT
    direction: 'unchanged by any swap (M10)'
    observation: 'total wage bill of the market, from payroll data'
    observation_status: PROPOSED

  - id: X18
    symbol: '$G_i$'
    role: output
    produced_by: [M11]
    meaning: '$\frac{S_P-|P|x_i}{|P|-1}-L$'
    referent: 'expected net payoff to worker $i$ from social navigation, valued risk-neutrally'
    support: POSIT
    direction: 'sums to $-|P|L$ over the pool (M12); negative for the richest entrant when $L>0$ (M24)'
    observation: 'mean income change net of the entry cost for workers from rank i who take the lottery route, from panel data'
    observation_status: PROPOSED

  - id: X19
    symbol: '$\bar x_{\mathrm{part}}$'
    role: output
    produced_by: [M13]
    meaning: '$\frac{S_P-(|P|-1)L}{|P|}$, with $G_i>0\iff x_i<\bar x_{\mathrm{part}}$'
    referent: 'income below which social navigation pays in expectation'
    support: POSIT
    direction: ''
    observation: 'income below which workers take the lottery route, estimated as a participation threshold on rank'
    observation_status: PROPOSED

  - id: X20
    symbol: '$\tfrac12u^{\prime\prime}(\bar y)\sigma_y^2$'
    role: output
    produced_by: [M15]
    meaning: 'second-order risk term in expected utility'
    referent: 'utility value of the income risk from social contests'
    support: POSIT
    direction: 'positive exactly where $u^{\prime\prime}>0$ (M16)'
    observation: 'not measured; a construct inferred only through choices under risk'
    observation_status: PROPOSED

  - id: X21
    symbol: '$p$'
    role: output
    produced_by: [M18]
    meaning: '$\tfrac12u^{\prime\prime}s^2m^2$, coefficient on $(1-\lambda)^2$'
    referent: 'risk-premium coefficient of a worker with income $m$'
    support: POSIT
    direction: 'scales with $m^2$ (M18)'
    observation: 'not measured directly; inferred from how take-up of the lottery route falls with income'
    observation_status: PROPOSED

  - id: X22
    symbol: '$S_P$'
    role: input
    meaning: 'sum of the incomes of the lottery entrants'
    referent: 'income held by those who compete through connections'
    support: POSIT
    direction: ''
    observation: 'sum of the wages of workers who take the lottery route, from panel data'
    observation_status: PROPOSED

  - id: X23
    symbol: '$|P|$'
    role: input
    meaning: 'number of lottery entrants'
    referent: 'number of workers competing through connections'
    support: POSIT
    direction: 'a risk-neutral pool of two or more with $L>0$ is not stable (M24)'
    observation: 'count of workers who take the lottery route, from panel data'
    observation_status: PROPOSED
