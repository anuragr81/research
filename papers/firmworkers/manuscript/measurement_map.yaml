meta:
  title: 'Inequality and Social Contests: measurement map'
  scope: 'Micro model only. Macro variables deferred.'
  pass: 2

support_status:
  LITERATURE: 'a literature claim uses the variable with this real-world meaning'
  POSIT: 'the paper''s own identification, supported by nothing else in the ledger'
  NONE: 'modelling device with no real-world referent'

observation_support:
  PROVEN: 'a Lean theorem shows the observed quantity determines the object within the model'
  DEFINITIONAL: 'the observed quantity is the object itself once the referent is accepted'
  LITERATURE: 'a literature row read in full measures the object'
  CONSTRUCT: 'not measured; a representation of recorded choices'
  UNVERIFIED: 'neither proven nor measured in a paper read in full; no headline may rest on it'

observation_status:
  PROPOSED: 'how an observer could obtain the object, proposed and awaiting the author''s confirmation'
  CONFIRMED: 'confirmed by the author'

term_status:
  PROPOSED: 'plain-English name proposed, awaiting the author''s agreement'
  AGREED: 'agreed by the author; the only name used for the object'

terms:
  - term: 'ladder'
    meaning: 'the fixed list of jobs ordered by income'
    defined_in: [M2, X15]
    avoid: ['hierarchy', 'labour queue']
    status: PROPOSED
  - term: 'job'
    meaning: 'one place on the ladder, held by one worker'
    defined_in: [M10, X1]
    avoid: ['position', 'slot']
    status: PROPOSED
  - term: 'bottom rung'
    meaning: 'the lowest job on the ladder, paying the bottom income'
    defined_in: [M32, X3]
    avoid: ['floor']
    status: PROPOSED
  - term: 'worker'
    meaning: 'a person on the ladder, who lives forever and is in one of two states, job holder or displaced worker'
    defined_in: [M39]
    avoid: ['employee', 'agent']
    status: PROPOSED
  - term: 'firm'
    meaning: 'the one firm of the closed economy, which sets the income of each job and receives the upskilling cost'
    defined_in: [M38]
    avoid: []
    status: PROPOSED
  - term: 'lifetime value'
    meaning: 'the discounted expected income of a worker over the rest of a working life, with displacement at the displacement rate'
    defined_in: [M39, M40]
    avoid: ['continuation value', 'present value']
    status: PROPOSED
  - term: 'lifetime multiplier'
    meaning: 'what one unit of income is worth for as long as the job is held, one over one less the discount factor times the chance of keeping the job'
    defined_in: [M40]
    avoid: []
    status: PROPOSED
  - term: 'job holder'
    meaning: 'the state of a worker who holds a job this period'
    defined_in: [M39, M30]
    avoid: ['incumbent', 'job keeper', 'stayer']
    status: PROPOSED
  - term: 'displaced worker'
    meaning: 'the state of a worker separated from a job by creative destruction this period; the job stays on the ladder, vacant'
    defined_in: [M32, M38, M39]
    avoid: ['job loser', 'separator']
    status: PROPOSED
  - term: 'downgrade'
    meaning: 'the route of a displaced worker that pays the bottom income'
    defined_in: [M32, M33]
    avoid: ['step down']
    status: PROPOSED
  - term: 'lottery'
    meaning: 'the route of a displaced worker that pays the lottery cost and receives the former job of a partner'
    defined_in: [M11, M14, M32]
    avoid: ['social lottery', 'social contest', 'social contests', 'social navigation', 'swap pool']
    status: PROPOSED
  - term: 'entrant'
    meaning: 'a displaced worker who takes the lottery'
    defined_in: [M14, M32]
    avoid: ['participant', 'lottery player']
    status: PROPOSED
  - term: 'pool'
    meaning: 'the set of entrants'
    defined_in: [M14, X23]
    avoid: ['swap pool']
    status: PROPOSED
  - term: 'partner'
    meaning: 'the entrant whose former job an entrant receives'
    defined_in: [M11, M14]
    avoid: ['counterparty']
    status: PROPOSED
  - term: 'former income'
    meaning: 'the income of the job a displaced worker lost'
    defined_in: [M32, M33]
    avoid: []
    status: PROPOSED
  - term: 'inequality'
    meaning: 'the spread of incomes across ranks, which falls as the tail index rises'
    defined_in: [M3, M4, X4]
    avoid: ['stakes']
    status: PROPOSED
  - term: 'valuing income at its average'
    meaning: 'utility linear in income, so a lottery is worth its mean income'
    defined_in: [M24]
    avoid: []
    status: PROPOSED
  - term: 'competing through connections'
    meaning: 'the real-world counterpart of the lottery'
    defined_in: [X8]
    avoid: ['social navigation', 'social contest', 'social contests']
    status: PROPOSED

rows:
  - id: X1
    symbol: '$N$'
    term: 'number of jobs'
    term_status: PROPOSED
    role: input
    meaning: 'number of workers, equal to the number of jobs'
    referent: 'size of the labour market'
    support: POSIT
    direction: ''
    observation: 'count of jobs in the market studied, from a job-title register or a matched employer-employee panel'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The observation is the object itself once the referent is accepted'

  - id: X2
    symbol: '$q\in[0,1)$'
    term: 'rank'
    avoid: ['position']
    term_status: PROPOSED
    role: input
    meaning: 'rank quantile of a job on the ladder; the market order, set by the firm, as against the status group, the order outside the market (M47)'
    referent: 'percentile of a job in the wage ranking'
    support: POSIT
    direction: 'higher $q$ is a better-paid job (M2)'
    observation: 'percentile of the job''s wage in the wage distribution of the same market, from payroll or matched employer-employee data'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.quantile_from_wage, Isc.pareto_strictMono_quantile]
    observation_note: 'On the ladder the wage determines the quantile, $q=1-(x/x_0)^{-a}$, and the wage is strictly increasing in $q$'

  - id: X3
    symbol: '$x_0$'
    term: 'bottom income'
    avoid: ['floor']
    term_status: PROPOSED
    role: input
    meaning: 'income at $q=0$'
    referent: 'lowest wage'
    support: POSIT
    direction: ''
    observation: 'lowest wage of the market, read as a low percentile of the wage distribution in payroll data'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.pareto_at_zero]
    observation_note: '$x(0)=x_0$'

  - id: X4
    symbol: '$a$'
    term: 'tail index'
    avoid: ['stakes']
    term_status: PROPOSED
    role: input
    meaning: 'tail index of the income ladder $x(q)=x_0(1-q)^{-1/a}$'
    referent: 'income dispersion across ranks, inversely'
    support: POSIT
    direction: 'higher $a$ lowers income at every interior quantile (M3) and narrows every income gap (M4), so higher $a$ means a more equal ladder'
    observation: 'Pareto index of the wage distribution, estimated as minus the slope of the log share of workers above a wage on the log of that wage'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.log_survival_linear]
    observation_note: 'On the ladder $\log(1-q)=-a(\log x-\log x_0)$, so the slope of log survival share on log wage is $-a$'

  - id: X5
    symbol: '$b$'
    term: 'cost exponent'
    avoid: ['cost level']
    term_status: PROPOSED
    role: input
    meaning: 'exponent of the upskilling cost $C(m_i,m_k)=(m_k-m_i)^b$'
    referent: 'convexity of the upskilling cost in the income distance climbed'
    support: POSIT
    direction: 'for $b\ge1$ two adjacent steps cost no more than the jump (M8). For $0\le b\le1$ the jump costs no more than the steps (M9)'
    observation: 'growth of the upskilling cost (tuition and earnings forgone while retraining) with the wage gap between origin and destination job, from training records linked to job moves'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.cost_exponent_log_linear]
    observation_note: '$\log C=b\log(m_k-m_i)$, so the slope of log cost on log wage gap is $b$'

  - id: X6
    symbol: '$m$'
    term: 'income'
    term_status: PROPOSED
    role: input
    meaning: 'income of a job, written $x$ on the ladder'
    referent: 'wage of a job'
    support: POSIT
    direction: ''
    observation: 'wage of the job, from payroll data'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The observation is the object itself once the referent is accepted'

  - id: X7
    symbol: '$L$'
    term: 'lottery cost'
    avoid: ['entry fee', 'entry cost']
    term_status: PROPOSED
    role: input
    meaning: 'fixed cost of entering the lottery'
    referent: 'spending that makes a displaced worker favourable to those above, such as status goods, favours, deference and membership fees, received by the job holders above the entrant (M58)'
    support: POSIT
    direction: 'higher $L$ lowers the participation threshold (M13) and the worth of the lottery for every nondecreasing $u$ (M53); shrinks the exchange window $[x_0+L, x_{top}-L]$ at both ends (M54); the poorer entrant of a pair gains only when $L$ is below the income gap (M46)'
    observation: 'spending on competing through connections directed at those above, such as status goods, membership fees and networking time, from expenditure or time-use surveys'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'That spending on networking measures the lottery cost is a posit; no paper read in full measures it'

  - id: X8
    symbol: 'reassignment rule'
    term: 'reassignment'
    avoid: ['swap', 'reshuffle']
    term_status: PROPOSED
    role: input
    meaning: 'the former jobs of the entrants are reassigned among them at random, each entrant receiving the former job of another entrant, every other entrant''s job equally likely (M14, M36), read as allocation by the favour of those above, which the worker cannot predict (issue 16); M29 weights a draw across status groups by $1-\sigma$, which no reassignment realises when the groups differ in size (M37)'
    referent: 'competing through connections, which reallocates jobs by connection or luck rather than by skill'
    support: POSIT
    direction: ''
    observation: 'not observed directly; its implication is a rank change after job loss that is unrelated to the worker''s own rank, testable on the distribution of rank changes in panel data'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'The implication for rank changes is not proven, and no paper read in full measures it'

  - id: X9
    symbol: '$u$'
    term: 'utility'
    avoid: ['happiness']
    term_status: PROPOSED
    role: input
    meaning: 'utility over income in expected-utility form, unique up to a positive affine transformation (decision of 10 Oct 2026), S-shaped in the manuscript, functional form not given'
    referent: 'attitude to income risk, risk-seeking below a reference income and risk-averse above it'
    support: POSIT
    direction: ''
    observation: 'not measured; a construct that rationalises recorded choices between the lottery route and the downgrade at each income'
    observation_status: PROPOSED
    observation_support: CONSTRUCT
    observation_note: 'Not measured, by the decision of 10 Oct 2026 (Q4); a representation of recorded choices'

  - id: X10
    symbol: '$\bar y$'
    term: 'mean lottery income'
    term_status: PROPOSED
    role: input
    meaning: 'mean of net income from the lottery component'
    referent: 'expected income'
    support: POSIT
    direction: ''
    observation: 'mean income change of workers who take the lottery route, from panel data'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The sample mean estimates the mean income change; the object is that mean once the referent is accepted'

  - id: X11
    symbol: '$\sigma_y$'
    term: 'lottery risk'
    term_status: PROPOSED
    role: input
    meaning: 'standard deviation of net income from the lottery component'
    referent: 'income risk created by competing through connections'
    support: POSIT
    direction: ''
    observation: 'standard deviation of that income change, from panel data'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The sample standard deviation estimates it once the referent is accepted'

  - id: X12
    symbol: '$\varepsilon$'
    term: 'standardised shock'
    term_status: PROPOSED
    role: input
    meaning: 'standardised shock, $\mathbb{E}\varepsilon=0$, $\mathbb{E}\varepsilon^2=1$'
    referent: ''
    support: NONE
    direction: ''
    observation: ''

  - id: X13
    symbol: '$s$'
    term: 'risk scale'
    term_status: PROPOSED
    role: input
    meaning: 'scale in $\sigma_y=s(1-\lambda)m$'
    referent: 'income risk per unit of income staked on competing through connections'
    support: POSIT
    direction: ''
    observation: 'ratio of the income risk of the lottery route to the income staked, compared across income levels in panel data'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.risk_scale_identified]
    observation_note: '$s=\sigma_y/((1-\lambda)m)$ whenever $(1-\lambda)m\ne0$'

  - id: X14
    symbol: '$\lambda$'
    term: 'upskilling share'
    term_status: PROPOSED
    role: input
    meaning: 'share of income allocated to upskilling, with $1-\lambda$ allocated to the lottery'
    referent: 'share of resources spent on upskilling rather than on competing through connections'
    support: POSIT
    direction: ''
    observation: 'share of spending on training or certification against spending on competing through connections, from expenditure or time-use surveys'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'That the spending shares measure the upskilling share is a posit; no paper read in full measures it'

  - id: X15
    symbol: '$x(q)$'
    term: 'ladder income'
    term_status: PROPOSED
    role: output
    produced_by: [M2]
    meaning: '$x_0(1-q)^{-1/a}$'
    referent: 'wage of the job at percentile $q$'
    support: POSIT
    direction: 'increasing in $q$ (M2), decreasing in $a$ (M3)'
    observation: 'wage at percentile q of the wage distribution, from payroll data'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.quantile_from_wage]
    observation_note: 'The wage at percentile $q$ is $x(q)$, and $q$ is recovered from it'

  - id: X16
    symbol: '$C(m_i,m_k)$'
    term: 'upskilling cost'
    avoid: ['retraining cost', 'transition cost', 'skill cost', 'acquisition cost', 'upward-move cost']
    term_status: PROPOSED
    role: output
    produced_by: [M7]
    meaning: '$(m_k-m_i)^b$ if $m_i<m_k$, $0$ otherwise'
    referent: 'upskilling cost of moving from job $i$ up to job $k$'
    support: POSIT
    direction: 'zero for downward and lateral moves (M7)'
    observation: 'upskilling cost of an observed upward move, from training records and earnings forgone'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The observation is the object itself once the referent is accepted'

  - id: X17
    symbol: '$S$'
    term: 'total income'
    term_status: PROPOSED
    role: output
    produced_by: [M10]
    meaning: '$\sum_k x_k$'
    referent: 'total wage bill'
    support: POSIT
    direction: 'unchanged when jobs change hands (M10)'
    observation: 'total wage bill of the market, from payroll data'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The observation is the object itself once the referent is accepted'

  - id: X18
    symbol: '$G_i$'
    term: 'expected lottery gain'
    term_status: PROPOSED
    role: output
    produced_by: [M11]
    meaning: '$\frac{S_P-|P|x_i}{|P|-1}-L$'
    referent: 'expected net payoff to worker $i$ from competing through connections, valued risk-neutrally'
    support: POSIT
    direction: 'sums to $-|P|L$ over the pool (M12); negative for the richest entrant when $L>0$ (M24)'
    observation: 'mean income change net of the lottery cost for workers from rank i who take the lottery route, from panel data'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.poolGain_closed]
    observation_note: 'The expected income change of an entrant under a uniform draw is the average of $x_k-x_i$ over the other entrants, which M11 equates to $G_i+L$'

  - id: X19
    symbol: '$\bar x_{\mathrm{part}}$'
    term: 'break-even income'
    term_status: PROPOSED
    role: output
    produced_by: [M13]
    meaning: '$\frac{S_P-(|P|-1)L}{|P|}$, with $G_i>0\iff x_i<\bar x_{\mathrm{part}}$'
    referent: 'income below which competing through connections pays in expectation'
    support: POSIT
    direction: ''
    observation: 'income below which workers take the lottery route, estimated as a participation threshold on rank'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'M13 identifies the threshold only under risk-neutral valuation, and M24 shows a risk-neutral pool of two or more is not stable, so an observed threshold also reflects the curvature of $u$'

  - id: X20
    symbol: '$\tfrac12u^{\prime\prime}(\bar y)\sigma_y^2$'
    term: 'risk term'
    term_status: PROPOSED
    role: output
    produced_by: [M15]
    meaning: 'second-order risk term in expected utility'
    referent: 'utility value of the income risk from competing through connections'
    support: POSIT
    direction: 'positive exactly where $u^{\prime\prime}>0$ (M16)'
    observation: 'not measured; a construct inferred only through choices under risk'
    observation_status: PROPOSED
    observation_support: CONSTRUCT
    observation_note: 'Not measured, by the decision of 10 Oct 2026 (Q4); a representation of recorded choices'

  - id: X21
    symbol: '$p$'
    term: 'risk-premium coefficient'
    term_status: PROPOSED
    role: output
    produced_by: [M18]
    meaning: '$\tfrac12u^{\prime\prime}s^2m^2$, coefficient on $(1-\lambda)^2$'
    referent: 'risk-premium coefficient of a worker with income $m$'
    support: POSIT
    direction: 'scales with $m^2$ (M18)'
    observation: 'not measured directly; inferred from how take-up of the lottery route falls with income'
    observation_status: PROPOSED
    observation_support: CONSTRUCT
    observation_note: 'Inferred from choices, never measured directly (decision of 10 Oct 2026, Q4)'

  - id: X22
    symbol: '$S_P$'
    term: 'pool income'
    term_status: PROPOSED
    role: input
    meaning: 'sum of the former incomes of the lottery entrants, who are displaced workers (M32)'
    referent: 'income held by those who compete through connections'
    support: POSIT
    direction: ''
    observation: 'sum of the wages of workers who take the lottery route, from panel data'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The observation is the object itself once the referent is accepted'

  - id: X23
    symbol: '$|P|$'
    term: 'pool size'
    term_status: PROPOSED
    role: input
    meaning: 'number of lottery entrants, who are displaced workers (M32)'
    referent: 'number of workers competing through connections'
    support: POSIT
    direction: 'sorting between the lottery and the downgrade shrinks as $1/(|P|-1)$ (M34)'
    observation: 'count of workers who take the lottery route, from panel data'
    observation_status: PROPOSED
    observation_support: DEFINITIONAL
    observation_note: 'The observation is the object itself once the referent is accepted'

  - id: X24
    symbol: '$h$'
    term: 'status group'
    avoid: ['human capital', 'status label', 'caste', 'wealth group', 'class']
    term_status: PROPOSED
    role: input
    meaning: 'status group of a worker, one of two, fixed within a working life (M28); the order outside the market, which governs access to lottery partners and nothing else (M47). Rank is the market order; neither is a function of the other'
    referent: 'a categorical identity such as ethnicity, religion, nationality or political identity, read as inherited status in the sense of Cole, Mailath and Postlewaite, assigned outside the market and not bought'
    support: POSIT
    direction: ''
    observation: 'group membership recorded in survey or administrative data, as self-reported identity'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'That a recorded identity is the status group of the model is a posit; no paper read in full measures it'

  - id: X25
    symbol: '$\sigma$'
    term: 'closure'
    avoid: ['categorical friction', 'friction']
    term_status: PROPOSED
    role: input
    meaning: 'closure parameter in $[0,1]$; a partner draw across groups has weight $1-\sigma$ against $1$ within the group (M29)'
    referent: 'social closure, the degree to which connections across status groups are restricted'
    support: POSIT
    direction: 'at $\sigma=0$ the contest ignores groups (M25), at $\sigma=1$ it runs within groups (M26); raising it lowers the gain of an entrant whose out-group is relatively richer (M27)'
    observation: 'share of lottery-route moves whose partner is from the other group, with the numbers of entrants in each group, from referral or network data linked to a matched employer-employee panel'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.crossShare_strictAnti, Isc.closure_from_crossShare]
    observation_note: 'Under the draw rule of M29, with $n$ in-group and $m$ out-group entrants besides the worker, the share of cross-group partners is $(1-\sigma)m/(n+(1-\sigma)m)$, strictly decreasing in $\sigma$, and $\sigma=1-nc/(m(1-c))$ for an observed share $c$; it needs out-group entrants, $m>0$'

  - id: X26
    symbol: '$G_i(\sigma)$'
    term: 'closure-weighted lottery gain'
    term_status: PROPOSED
    role: output
    produced_by: [M25, M26, M27]
    meaning: '$\frac{a+(1-\sigma)b}{n+(1-\sigma)m}-L$, the closure-weighted expected lottery gain'
    referent: 'expected net payoff from competing through connections when connections are closed along status lines'
    support: POSIT
    direction: 'equals $G_i$ of M11 at $\sigma=0$ (M25)'
    observation: 'mean income change net of the lottery cost for entrants of each group who take the lottery route, from panel data'
    observation_status: PROPOSED
    observation_support: PROVEN
    observation_lean: [Isc.closureGain_formula]
    observation_note: 'The closure-weighted gain is the weighted average of $x_k-x_i$ over the other entrants, weights $1$ within and $1-\sigma$ across groups'

  - id: X27
    symbol: 'return route'
    term: 'return'
    avoid: ['costly return', 're-entry']
    term_status: PROPOSED
    role: input
    meaning: 'the route of a displaced worker that regains the former job, income $x_i$, by paying the upskilling cost $C(f,x_i)$ of climbing from the income $f$ of the downgrade back to the former income; the firm receives the payment (M38). Under M32, $f=x_0$'
    referent: 'regaining one''s former job, or its wage, after retraining or certification'
    support: POSIT
    direction: ''
    observation: 're-employment in the former job, or at the former wage, after retraining, from linked payroll records of firms and workers'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'No paper read in full measures it. The nearest measured event is recall to the former employer after a layoff (leads, unread: Katz 1986; Fujita and Moscarini 2017), which usually involves no retraining'

  - id: X28
    symbol: '$d$'
    term: 'displacement rate'
    avoid: ['separation rate', 'layoff rate']
    term_status: PROPOSED
    role: input
    meaning: 'chance that a job holder is displaced in a period, the same at every rank (M39)'
    referent: 'yearly rate of job loss through plant closings, failed projects and reorganisation'
    support: POSIT
    direction: ''
    observation: 'share of job holders displaced per year, from displaced worker surveys or linked payroll records of firms and workers'
    observation_status: PROPOSED
    observation_support: UNVERIFIED
    observation_note: 'No paper read in full measures a rate; JLS count separators in one state over one period and do not report a rate'

  - id: X29
    symbol: '$\beta$'
    term: 'discount factor'
    avoid: ['patience']
    term_status: PROPOSED
    role: input
    meaning: 'weight a worker places on next period''s value (M39)'
    referent: 'time preference of workers'
    support: POSIT
    direction: ''
    observation: 'not observed directly; a construct set by convention or estimated from choices over time'
    observation_status: PROPOSED
    observation_support: CONSTRUCT
    observation_note: 'Like utility, a representation of recorded choices rather than a measured quantity'
