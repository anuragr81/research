name = "jeffreyorder"
version = "0.1.0"
keywords = ["math", "probability", "jeffrey-conditioning"]
defaultTargets = ["JeffreyOrder", "AssocLocality", "AssocLocalityStructural"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "JeffreyOrder"

[[lean_lib]]
name = "AssocLocality"

[[lean_lib]]
name = "AssocLocalityStructural"
